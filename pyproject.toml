[project]
name = "open-tmod"
version = "0.1.0"
description = "Open T-Modeler: open transportation modeling platform (Graph Engineering build)"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15.6755",
]

[project.optional-dependencies]
extract = [
    "oracledb>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmod"]
