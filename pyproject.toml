[project]
name = "open-tmod"
version = "0.1.0"
description = "Open T-Modeler: open transportation modeling platform (Graph Engineering build)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.3.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
extract = [
    "oracledb>=26.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmod"]
